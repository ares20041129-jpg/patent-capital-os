name: Bug report
description: Report a reproducible Patent Capital OS problem.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command, input shape, and relevant output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which commit or release did you use?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - intake
        - reference-delta
        - draft-generation
        - legal-compliance-gate
        - application-materials
        - quality-review
        - handoff
        - queue-or-regression
        - docs
        - other
  - type: checkboxes
    id: sensitive
    attributes:
      label: Safety check
      options:
        - label: I did not include private applicant data, credentials, or confidential invention materials.
          required: true
