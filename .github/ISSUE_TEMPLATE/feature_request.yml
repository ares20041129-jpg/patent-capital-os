name: Feature request
description: Suggest an improvement or new workflow.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Boundary impact
      options:
        - local-only validation
        - local generation
        - read-only handoff
        - official filing boundary affected
        - unsure
  - type: checkboxes
    id: constraints
    attributes:
      label: Safety check
      options:
        - label: This request does not require bypassing official controls or weakening legal/compliance gates.
          required: true
